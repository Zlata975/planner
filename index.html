<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlexiDay Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ECE4E5'/%3E%3Ctext x='50' y='72' font-size='65' font-family='Arial' fill='%2372251F' text-anchor='middle' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ECE4E5'/%3E%3Ctext x='50' y='72' font-size='65' font-family='Arial' fill='%2372251F' text-anchor='middle' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#2B2B30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FlexiDay">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22FlexiDay%20Planner%22%2C%22short_name%22%3A%22FlexiDay%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%232B2B30%22%2C%22theme_color%22%3A%22%232B2B30%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20192%20192'%3E%253Crect%20width%3D'192'%20height%3D'192'%20rx%3D'42'%20fill%3D'%2523ECE4E5'%2F%3E%253Ctext%20x%3D'96'%20y%3D'138'%20font-size%3D'125'%20font-family%3D'Arial'%20fill%3D'%252372251F'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EF%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%2C%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20512%20512'%3E%253Crect%20width%3D'512'%20height%3D'512'%20rx%3D'112'%20fill%3D'%2523ECE4E5'%2F%3E%253Ctext%20x%3D'256'%20y%3D'368'%20font-size%3D'333'%20font-family%3D'Arial'%20fill%3D'%252372251F'%20text-anchor%3D'middle'%20font-weight%3D'bold'%3EF%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
<style>
/* ===== ТЁМНАЯ ТЕМА: ТЁМНО-СЕРАЯ ===== */
:root {
--bg: #2B2B30;
--bg-soft: #35353B;
--card: rgba(53, 53, 59, 0.78);
--glass: rgba(53, 53, 59, 0.55);
--border: rgba(200, 200, 205, 0.16);
--text: #ECE4E5;
--sub: #A0A0A8;
--accent: #72251F;
--accent-light: #A5AF5D;
--accent-rgb: 114, 37, 31;
--accent-text: #ECE4E5;
--input: rgba(35, 35, 40, 0.85);
--danger: #D98A85;
--success: #9CC4AE;
--time-scheme: dark;
}
/* ===== СВЕТЛАЯ ТЕМА: МОЛОЧНАЯ ===== */
.light-theme {
--bg: #ECE4E5;
--bg-soft: #F5F0F0;
--card: rgba(255, 253, 253, 0.75);
--glass: rgba(255, 253, 253, 0.55);
--border: rgba(43, 43, 48, 0.12);
--text: #2B2B30;
--sub: #6F6F78;
--accent: #72251F;
--accent-light: #A5AF5D;
--accent-rgb: 114, 37, 31;
--accent-text: #ECE4E5;
--input: rgba(255, 255, 255, 0.85);
--danger: #72251F;
--success: #4a7a62;
--time-scheme: light;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
transition:background 0.25s,color 0.25s; overscroll-behavior:none;
-webkit-user-select:none; user-select:none;
}
/* ШАПКА */
.header { background:var(--card); backdrop-filter:blur(18px); padding:9px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); z-index:10; }
.header h1 { font-size:17px; display:flex; align-items:center; gap:7px; letter-spacing:0.2px; }
.logo { background:var(--accent); color:var(--accent-text); width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; transition:background 0.2s,color 0.2s; }
.btn { padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--glass); color:var(--text); font-size:12px; cursor:pointer; font-weight:600; transition:background 0.15s; }
.btn:hover { background:var(--card); }
.btn.accent { background:var(--accent); border-color:var(--accent); color:var(--accent-text); transition:background 0.2s,color 0.2s; }
/* ПАНЕЛЬ ДОБАВЛЕНИЯ */
.panel { background:var(--card); backdrop-filter:blur(18px); border-bottom:1px solid var(--border); padding:8px 14px; z-index:9; }
.row { display:flex; gap:6px; align-items:center; margin-bottom:5px; }
.row input, .row select { padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--input); color:var(--text); font-size:13px; outline:none; }
.row input:focus, .row select:focus { border-color:var(--accent-light); }
.row input { flex:2; min-width:0; }
.row select { flex:1; min-width:0; }
input::placeholder { color:var(--sub); }
.time-pick { display:flex; gap:3px; align-items:center; flex:0 0 auto; }
.time-pick select { width:52px; padding:8px 2px; text-align:center; }
.time-pick span { color:var(--sub); font-weight:700; font-size:13px; }
.dur-pick { display:flex; gap:3px; align-items:center; flex:0 0 auto; }
.dur-pick input {
width:44px; padding:8px 2px; text-align:center; flex:0 0 44px!important;
-moz-appearance:textfield;
}
.dur-pick input::-webkit-outer-spin-button,
.dur-pick input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.dur-pick span { color:var(--sub); font-weight:700; font-size:12px; }
.pin { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--sub); padding:7px 9px; border-radius:8px; background:var(--input); border:1px solid var(--border); white-space:nowrap; cursor:pointer; font-weight:600; }
.pin input { width:14px; height:14px; flex:0 0 14px!important; accent-color:var(--accent-light); }
/* КАЛЕНДАРЬ */
.cal { flex:1; overflow-y:auto; padding:8px 12px; -webkit-overflow-scrolling:touch; }
.nav { display:flex; align-items:center; justify-content:center; gap:6px; padding:6px 0; font-weight:700; font-size:13px; position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap; }
.nav button { background:var(--glass); border:1px solid var(--border); color:var(--text); padding:4px 9px; border-radius:6px; cursor:pointer; font-size:12px; }
.nav button.active { background:var(--accent); border-color:var(--accent); color:var(--accent-text); transition:background 0.2s,color 0.2s; }
.now-toggle { font-size:10px; cursor:pointer; color:var(--sub); display:flex; align-items:center; gap:3px; }
.now-toggle input { width:13px; height:13px; accent-color:var(--accent-light); }
.grid { border:1px solid var(--border); border-radius:12px; overflow:hidden; position:relative; background:var(--card); }
/* ДЕНЬ */
.day-grid { position:relative; }
.day-slot { display:flex; border-bottom:1px solid var(--border); height:16px; cursor:pointer; position:relative; }
.day-slot:hover { background:rgba(var(--accent-rgb),0.05); }
.day-hour { width:42px; padding:0 4px; font-size:9px; line-height:15px; color:var(--sub); border-right:1px solid var(--border); flex-shrink:0; overflow:hidden; }
.day-content { flex:1; position:relative; }
.task-block { position:absolute; left:44px; right:2px; border-radius:4px; padding:2px 6px; font-size:10px; font-weight:600; cursor:grab; z-index:2; display:flex; align-items:center; gap:5px; overflow:hidden; white-space:nowrap; border:1px solid rgba(43,43,48,0.12); box-shadow:0 1px 3px rgba(43,43,48,0.12); }
.task-block:active { cursor:grabbing; }
.task-block.dragging { opacity:0.75; box-shadow:0 8px 22px rgba(43,43,48,0.35); z-index:10; }
.task-block.fixed { cursor:default!important; border-left:3px solid rgba(43,43,48,0.35); }
.task-block .resize-handle { position:absolute; bottom:0; left:0; right:0; height:6px; cursor:ns-resize; z-index:5; }
.task-block.fixed .resize-handle { display:none; }
.task-time { margin-left:auto; font-size:9px; opacity:0.8; flex-shrink:0; white-space:nowrap; }
/* ==== КРУПНЫЙ КРЕСТИК УДАЛЕНИЯ ==== */
.task-del {
margin-left:4px;
cursor:pointer;
opacity:0.75;
font-size:17px;
line-height:1;
font-weight:700;
flex-shrink:0;
z-index:10;
padding:3px 6px;
border-radius:5px;
background:rgba(255,255,255,0.28);
display:flex;
align-items:center;
justify-content:center;
min-width:24px;
min-height:24px;
transition:background 0.15s, opacity 0.15s;
}
.task-del:hover, .task-del:active { opacity:1; background:rgba(255,255,255,0.55); }
.task-dup {
margin-left:3px;
cursor:pointer;
opacity:0.55;
font-size:12px;
flex-shrink:0;
z-index:10;
padding:2px 4px;
}
.task-dup:hover { opacity:1; }
.now-line { position:absolute; left:44px; right:0; height:2px; background:var(--danger); z-index:3; pointer-events:none; }
.now-line::before { content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px; background:var(--danger); border-radius:50%; }
/* НЕДЕЛЯ */
.week-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.week-table { min-width:580px; }
.week-header { display:flex; border-bottom:1px solid var(--border); background:var(--glass); }
.week-header .whour { width:42px; flex-shrink:0; }
.week-header .wday { flex:1; text-align:center; padding:6px 2px; font-size:11px; font-weight:700; border-left:1px solid var(--border); min-width:68px; color:var(--sub); }
.week-row { display:flex; border-bottom:1px solid var(--border); height:28px; position:relative; }
.week-row .whour { width:42px; font-size:9px; color:var(--sub); padding:1px 4px; flex-shrink:0; overflow:hidden; }
.week-row .wday { flex:1; position:relative; border-left:1px solid var(--border); height:28px; padding:1px; min-width:68px; }
.week-task { position:absolute; left:1px; right:1px; font-size:9px; padding:1px 4px; border-radius:4px; cursor:grab; overflow:hidden; white-space:nowrap; z-index:2; display:flex; align-items:center; gap:2px; border:1px solid rgba(43,43,48,0.12); }
.week-task.fixed { cursor:default!important; border-left:2px solid rgba(43,43,48,0.35); }
.week-task .resize-handle { position:absolute; bottom:0; left:0; right:0; height:4px; cursor:ns-resize; z-index:5; }
.week-task.fixed .resize-handle { display:none; }
.week-task .task-del { font-size:14px; min-width:20px; min-height:20px; padding:2px 5px; margin-left:2px; }
.week-task .task-dup { margin-left:2px; font-size:10px; }
/* МЕСЯЦ */
.month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border-radius:12px; overflow:hidden; }
.month-day-name { background:var(--glass); text-align:center; padding:5px; font-size:11px; font-weight:700; color:var(--sub); }
.month-day { background:var(--card); min-height:58px; padding:3px; cursor:pointer; }
.month-day:hover { background:rgba(var(--accent-rgb),0.07); }
.month-day-num { font-size:11px; font-weight:700; margin-bottom:2px; }
.month-task { font-size:9px; padding:1px 3px; border-radius:3px; margin-bottom:1px; overflow:hidden; white-space:nowrap; }
/* ЗАМЕТКИ */
.notes-container { padding:16px; display:flex; flex-direction:column; gap:10px; }
.note-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; }
.note-card textarea { width:100%; min-height:80px; background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:13px; resize:vertical; font-family:inherit; outline:none; }
.note-card .note-actions { display:flex; gap:6px; margin-top:8px; justify-content:flex-end; }
.note-date { font-size:10px; color:var(--sub); margin-bottom:6px; }
/* МОДАЛКИ */
.modal-bg { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(20,20,24,0.5); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s; }
.modal-bg.show { opacity:1; pointer-events:all; }
.modal { background:var(--bg-soft); border-radius:18px; padding:20px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto; border:1px solid var(--border); display:flex; flex-direction:column; gap:10px; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
.modal h3 { font-size:16px; }
.modal label { font-size:11px; color:var(--sub); font-weight:600; }
.modal input, .modal select, .modal textarea { padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--input); color:var(--text); font-size:13px; outline:none; width:100%; }
.modal textarea { min-height:100px; resize:vertical; font-family:inherit; }
.cat-row { display:flex; gap:6px; }
.cat-row input { flex:1; }
.emoji-btn { width:42px; height:42px; border-radius:8px; border:1px solid var(--border); background:var(--input); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.colors { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; }
.swatch { aspect-ratio:1; border-radius:8px; cursor:pointer; border:2px solid transparent; }
.swatch.sel { border-color:var(--accent); box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.35); }
.emoji-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; max-height:140px; overflow-y:auto; padding:4px; background:var(--input); border-radius:10px; }
.emoji-grid button { aspect-ratio:1; border:none; background:transparent; font-size:18px; cursor:pointer; border-radius:6px; }
.cat-item { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--input); border-radius:8px; font-size:12px; font-weight:600; border:1px solid var(--border); }
.cat-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.cat-del { margin-left:auto; background:transparent; border:1px solid var(--border); color:var(--danger); cursor:pointer; padding:3px 7px; border-radius:5px; font-size:11px; font-weight:700; }
.accent-colors { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.accent-swatch { padding:12px 6px; border-radius:10px; cursor:pointer; border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; text-align:center; transition:transform 0.15s; }
.accent-swatch:hover { transform:scale(1.03); }
.accent-swatch.selected { border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.3); }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:rgba(var(--accent-rgb),0.35); border-radius:6px; }
::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>
<div id="app" style="display:none;flex-direction:column;height:100vh;">
<div class="header">
<h1><span class="logo">📅</span>FlexiDay</h1>
<div style="display:flex;gap:4px;">
<button class="btn" onclick="openNotes()">📝</button>
<button class="btn" onclick="openCats()">🎨</button>
<button class="btn" onclick="openSets()">⚙️</button>
</div>
</div>
<div id="mainContent" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
<div id="calendarView" style="display:flex;flex-direction:column;height:100%;">
<div class="panel">
<div class="row">
<input type="text" id="tn" placeholder="Название задачи">
<select id="tc"></select>
</div>
<div class="row">
<div class="time-pick">
<select id="th"></select>
<span>:</span>
<select id="tm"></select>
</div>
<div class="dur-pick" title="Продолжительность: часы и минуты">
<input type="number" id="tdh" value="0" min="0" max="23">
<span>ч</span>
<input type="number" id="tdm" value="30" min="0" max="59" step="5">
<span>мин</span>
</div>
<label class="pin"><input type="checkbox" id="tf" checked>📌</label>
</div>
<button class="btn accent" onclick="addTask()" style="width:100%;padding:9px;">✨ Добавить</button>
</div>
<div class="cal" id="calContainer">
<div class="nav">
<button onclick="chView(-1)">◀</button>
<span id="dateLabel"></span>
<button onclick="chView(1)">▶</button>
<button onclick="goToday()" style="font-size:10px;">Сегодня</button>
<button id="btnDay" class="active" onclick="setView('day')">День</button>
<button id="btnWeek" onclick="setView('week')">Неделя</button>
<button id="btnMonth" onclick="setView('month')">Месяц</button>
<label class="now-toggle"><input type="checkbox" id="showNow" checked onchange="drawCal()"> линия времени</label>
<button class="btn" onclick="scrollToNow()" style="font-size:10px;">Сейчас</button>
</div>
<div class="grid" id="grid"></div>
</div>
</div>
<div id="notesView" style="display:none;flex-direction:column;height:100%;">
<div style="padding:12px 16px;display:flex;gap:6px;">
<button class="btn accent" onclick="addNote()" style="flex:1;">➕ Новая заметка</button>
</div>
<div class="notes-container" id="notesContainer" style="flex:1;overflow-y:auto;"></div>
</div>
</div>
</div>

<div class="modal-bg" id="catMod">
<div class="modal">
<h3>🎨 Разделы</h3>
<div id="catList"></div>
<div class="cat-row">
<button class="emoji-btn" id="emojiBtn" onclick="toggleEmoji()">📁</button>
<input type="text" id="newCatName" placeholder="Название">
</div>
<div class="emoji-grid" id="emojiGrid" style="display:none;"></div>
<div class="colors" id="palette"></div>
<button class="btn accent" onclick="addCat()" style="width:100%;">➕ Добавить</button>
<button class="btn" onclick="closeMod('catMod')">Закрыть</button>
</div>
</div>

<div class="modal-bg" id="setMod">
<div class="modal">
<h3>⚙️ Настройки</h3>
<label>Тема</label>
<select id="sTheme" onchange="applyTheme()">
<option value="light">Светлая (молочная)</option>
<option value="dark">Тёмная (тёмно-серая)</option>
</select>
<label>Акцентный цвет интерфейса</label>
<div class="accent-colors" id="accentPalette"></div>
<label>Первый день недели</label>
<select id="sFirstDay" onchange="sets('firstDay',this.value);drawCal();">
<option value="1">Понедельник</option>
<option value="0">Воскресенье</option>
<option value="6">Суббота</option>
</select>
<label>Начало дня</label>
<input type="time" id="sStart" value="06:00" onchange="saveBounds()">
<label>Конец дня</label>
<input type="time" id="sEnd" value="23:00" onchange="saveBounds()">
<button class="btn accent" onclick="closeMod('setMod');drawCal();">Готово</button>
</div>
</div>

<script>
// ================= ПАЛИТРА ЗАДАЧ =================
const PALETTE = ['#eecfff','#bde8ff','#b0c7f2','#ff93b0','#ffc6dc','#ffd4d4','#ffdaf5','#ff9f9f'];

// ================= АКЦЕНТНЫЕ ЦВЕТА (только 2) =================
const ACCENT_COLORS = [
{name:'Тёмно-красный', color:'#72251F', light:'#72251F'},
{name:'Оливковый', color:'#A5AF5D', light:'#A5AF5D'}
];
const ALLOWED_ACCENTS = ACCENT_COLORS.map(c => c.color);

const EMOJIS = ['🏋️','💼','🌱','📚','🎨','🎵','💻','🏃','🧘','🍳','🧹','🛒','✈️','🚗','🏠','💤','⏰','📝','💡','🎯','💰','❤️','🌟','🔥','🎉','📞','✉️','🗓️','☕','🍽️','🐱','🐶','🎮','📷','🎬','🧠','💪','🤝','🛠️','📊','🔬','🌍','🎪','🏆','💎','🌈','🍀','🎁','📌','🔔','⚡','🎈','🌙','☀️','🌸','🍕','🎧','📱','💊','🧩'];

const DEF_CATS = [
{id:'c1', name:'Спорт', emoji:'🏋️', color:'#ff93b0'},
{id:'c2', name:'Работа', emoji:'💼', color:'#bde8ff'},
{id:'c3', name:'Личное', emoji:'🌱', color:'#eecfff'}
];

const SLOT = 16; // высота 5 минут в дне
const ROWH = 28; // высота часа в неделе

// ================= СОСТОЯНИЕ =================
let localData = {
settings: {
theme: 'light',
accent: '#72251F',
accentLight: '#72251F',
firstDay: '1',
dayStart: '06:00',
dayEnd: '23:00'
},
categories: JSON.parse(JSON.stringify(DEF_CATS)),
tasks: [],
notes: []
};
let curDate = new Date();
let viewMode = 'day';
let selEmoji = '📁';
let selColor = PALETTE[0];
let currentScreen = 'calendar';

// ================= ДАТЫ (ЛОКАЛЬНОЕ ВРЕМЯ) =================
function pad(n){ return String(n).padStart(2,'0'); }
function localDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function localISO(d){ return localDateStr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00'; }
function sameDay(a,b){ return localDateStr(a)===localDateStr(b); }
function fmtTime(iso){ const d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDuration(mins){ return mins>=60 ? (Math.round(mins/60*10)/10)+' ч' : mins+' мин'; }
function isLight(h){
const r=parseInt(h.slice(1,3),16), g=parseInt(h.slice(3,5),16), b=parseInt(h.slice(5,7),16);
return (0.299*r+0.587*g+0.114*b)/255 > 0.65;
}

// ================= ХРАНИЛИЩЕ =================
function loadLocal(){
const saved = localStorage.getItem('flexiday_data_v2');
if(saved){ try{ localData = JSON.parse(saved); }catch(e){} }

if(!localData.settings) localData.settings = {};
if(!ALLOWED_ACCENTS.includes(localData.settings.accent)){
localData.settings.accent = '#72251F';
localData.settings.accentLight = '#72251F';
saveLocal();
}
applySettings();
}
function saveLocal(){ localStorage.setItem('flexiday_data_v2', JSON.stringify(localData)); }
function sett(k,d){ return localData.settings[k] !== undefined ? localData.settings[k] : d; }
function sets(k,v){ localData.settings[k]=v; saveLocal(); }

function applySettings(){
document.body.className = localData.settings.theme === 'light' ? 'light-theme' : '';
applyAccent(localData.settings.accent || '#72251F', localData.settings.accentLight || '#72251F');
}

function applyAccent(c,l){
const el = document.body;
if(!el) return;
const isLightTheme = el.classList.contains('light-theme');
const a = isLightTheme ? (l||c) : c;
el.style.setProperty('--accent', a);
el.style.setProperty('--accent-light', l||c);
const h = a.replace('#','');
el.style.setProperty('--accent-rgb',
parseInt(h.substring(0,2),16)+','+
parseInt(h.substring(2,4),16)+','+
parseInt(h.substring(4,6),16));
el.style.setProperty('--accent-text', isLight(a) ? '#2B2B30' : '#ECE4E5');
}

function updateNote(id,text){ const n = localData.notes.find(x=>x.id===id); if(n){ n.text=text; saveLocal(); } }

// ================= РАЗДЕЛЫ =================
function cats(){

localData.categories = JSON.parse(JSON.stringify(DEF_CATS));
saveLocal();
}
return localData.categories;
}
function catById(id){ return cats().find(c=>c.id===id); }
function renderCatSelect(){

if(sel) sel.innerHTML = cats().map(c=>`<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');

function delCat(id){

saveLocal();
renderCatSelect(); openCats(); drawCal();
}

// ================= ЗАДАЧИ =================
function addTask(){
const tn = document.getElementById('tn');
if(!tn) return;
const name = tn.value.trim();
const cid = document.getElementById('tc')?.value;
const hh = parseInt(document.getElementById('th').value) || 0;
const mm = parseInt(document.getElementById('tm').value) || 0;

// Продолжительность: часы + минуты отдельно
const dh = parseInt(document.getElementById('tdh')?.value) || 0;
const dm = parseInt(document.getElementById('tdm')?.value) || 0;

const fixed = document.getElementById('tf')?.checked;
if(!name) return;

let mins = dh*60 + dm;
if(mins < 5) mins = 5; // минимум 5 минут

const dayStr = localDateStr(curDate);
const start = new Date(dayStr + 'T' + pad(hh) + ':' + pad(mm) + ':00');
const end = new Date(start.getTime() + mins*60000);
const cat = catById(cid);

localData.tasks.push({
id:'t'+Date.now(),
title:name,
start: localISO(start),
end: localISO(end),
duration: mins,
catId: cid,
color: cat ? cat.color : PALETTE[0],
emoji: cat ? cat.emoji : '📌',
fixed: !!fixed
});
saveLocal();

tn.value = '';
document.getElementById('th').value = '0'; // часы начала сбрасываются
drawCal();
}

function delTask(id){
localData.tasks = localData.tasks.filter(t=>t.id!==id);
saveLocal(); drawCal();
}

function duplicateTask(id){
const src = localData.tasks.find(t=>t.id===id);
if(!src) return;
const s = new Date(src.start);
const e = new Date(src.end);
const dur = e - s;
const ns = new Date(s.getTime() + 30*60000);
const ne = new Date(ns.getTime() + dur);
localData.tasks.push({
...src,
id:'t'+Date.now(),
start: localISO(ns),
end: localISO(ne)
});
saveLocal(); drawCal();
}

function updateTask(id, startDate, endDate){
const t = localData.tasks.find(x=>x.id===id);
if(t && !t.fixed){
t.start = localISO(startDate);
t.end = localISO(endDate);
t.duration = Math.round((endDate - startDate)/60000);
saveLocal();
}
}

function setView(m){
viewMode = m;
document.getElementById('btnDay')?.classList.toggle('active', m==='day');
document.getElementById('btnWeek')?.classList.toggle('active', m==='week');
document.getElementById('btnMonth')?.classList.toggle('active', m==='month');
drawCal();
}
function chView(d){
if(viewMode==='day') curDate.setDate(curDate.getDate()+d);
else if(viewMode==='week') curDate.setDate(curDate.getDate()+d*7);
else curDate.setMonth(curDate.getMonth()+d);
drawCal();
}
function goToday(){ curDate = new Date(); drawCal(); }
function scrollToNow(){
const now = new Date();
const slot = document.querySelector(`.day-slot[data-h="${now.getHours()}"][data-m="${Math.floor(now.getMinutes()/5)*5}"]`);
if(slot) slot.scrollIntoView({behavior:'smooth', block:'center'});
}
function dayTasks(dt){
const key = localDateStr(dt);
return localData.tasks.filter(t=> localDateStr(new Date(t.start)) === key);
}

// ================= КАЛЕНДАРЬ =================
function drawCal(){
if(currentScreen !== 'calendar') return;
const ms = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
if(viewMode==='day'){
document.getElementById('dateLabel').textContent =
`${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][curDate.getDay()]}, ${curDate.getDate()} ${ms[curDate.getMonth()]}`;
drawDay();
} else if(viewMode==='week'){
const w = getWeek(curDate);
document.getElementById('dateLabel').textContent =
`${w[0].getDate()} ${ms[w[0].getMonth()]} — ${w[6].getDate()} ${ms[w[6].getMonth()]}`;
drawWeek(w);
} else {
document.getElementById('dateLabel').textContent =
`${ms[curDate.getMonth()]} ${curDate.getFullYear()}`;
drawMonth();
}
}

// ---------- ДЕНЬ ----------
function drawDay(){
const sh = parseInt(sett('dayStart','06:00'));
const eh = parseInt(sett('dayEnd','23:00'));
const all = dayTasks(curDate);
const now = new Date();
const isToday = sameDay(curDate, now);
const showNow = document.getElementById('showNow')?.checked ?? true;
const gs = sh*60;
const ge = (eh+1)*60;

let html = '<div class="day-grid" style="position:relative;">';

for(let h=sh; h<=eh; h++){
for(let m=0; m<60; m+=5){
html += `<div class="day-slot" data-h="${h}" data-m="${m}">
<div class="day-hour">${m===0 ? pad(h)+':00' : ''}</div>
<div class="day-content"></div>
</div>`;
}
}

all.forEach(t=>{
const s = new Date(t.start);
const e = new Date(t.end);
const sm = s.getHours()*60 + s.getMinutes();
const em = e.getHours()*60 + e.getMinutes();
if(em <= gs || sm >= ge) return;

const top = (Math.max(sm, gs) - gs) / 5 * SLOT;
const hgt = Math.max((Math.min(em, ge) - Math.max(sm, gs)) / 5 * SLOT, SLOT);
const tc = isLight(t.color) ? '#2B2B30' : '#ECE4E5';
const dur = t.duration || Math.round(em - sm);

html += `<div class="task-block${t.fixed?' fixed':''}" data-id="${t.id}"
style="top:${top}px;height:${hgt}px;background:${t.color};color:${tc};"
onclick="event.stopPropagation();">
${t.emoji||''} ${t.title}
<span class="task-time">${fmtTime(t.start)}–${fmtTime(t.end)} (${fmtDuration(dur)})</span>
<span class="task-dup" onclick="event.stopPropagation();duplicateTask('${t.id}')" title="Дублировать">⧉</span>
<span class="task-del" onclick="event.stopPropagation();delTask('${t.id}')" title="Удалить">✕</span>
${t.fixed ? '' : '<div class="resize-handle"></div>'}
</div>`;
});

if(isToday && showNow){
const nm = now.getHours()*60 + now.getMinutes();
if(nm >= gs && nm <= ge){
html += `<div class="now-line" style="top:${(nm-gs)/5*SLOT}px;"></div>`;
}
}

html += '</div>';
document.getElementById('grid').innerHTML = html;
setupDayDrag(sh);

document.querySelectorAll('.day-slot').forEach(slot=>{
slot.addEventListener('click', function(e){
if(e.target.closest('.task-block')) return;
document.getElementById('th').value = String(parseInt(this.dataset.h));
document.getElementById('tm').value = String(parseInt(this.dataset.m));
document.getElementById('tn')?.focus();
});
});
}

function setupDayDrag(sh){
const grid = document.querySelector('.day-grid');
if(!grid) return;
const isTouch = 'ontouchstart' in window;
let el = null, startY = 0, startTop = 0, startHeight = 0, tid = null, resizing = false;

function onStart(e){
const point = isTouch ? e.touches[0] : e;
if(isTouch && e.target.closest('.task-del, .task-dup')) return;
const tb = (!isTouch ? e.target : document.elementFromPoint(point.clientX, point.clientY))?.closest('.task-block');
if(!tb || tb.classList.contains('fixed')) return;

const handleEl = (isTouch ? document.elementFromPoint(point.clientX, point.clientY) : e.target);
resizing = !!(handleEl?.closest('.resize-handle'));

el = tb;
tid = tb.dataset.id;
startY = point.clientY;
startTop = tb.offsetTop;
startHeight = tb.offsetHeight;

tb.classList.add('dragging');
if(!isTouch) tb.setPointerCapture(e.pointerId);
e.preventDefault();
}

function onMove(e){
if(!el) return;
const point = isTouch ? e.touches[0] : e;
const dy = point.clientY - startY;
if(resizing){
el.style.height = Math.max(SLOT, startHeight + dy) + 'px';
} else {
el.style.top = Math.max(0, startTop + Math.round(dy/SLOT)*SLOT) + 'px';
}
if(isTouch) e.preventDefault();
}

function onEnd(){
if(!tid || !el) return;
const gs = sh*60;

const topPx = parseInt(el.style.top || 0);
const hgtPx = parseInt(el.style.height || SLOT);

const newStartMin = gs + Math.round(topPx / SLOT) * 5;
const newEndMin = newStartMin + Math.max(Math.round(hgtPx / SLOT) * 5, 5);

const dayStr = localDateStr(curDate);
const ns = new Date(dayStr + 'T' + pad(Math.floor(newStartMin/60)) + ':' + pad(newStartMin%60) + ':00');
const ne = new Date(dayStr + 'T' + pad(Math.floor(newEndMin/60)) + ':' + pad(newEndMin%60) + ':00');

updateTask(tid, ns, ne);

el.classList.remove('dragging');
el = null; tid = null; resizing = false;
drawCal();
}

if(isTouch){
grid.addEventListener('touchstart', onStart, {passive:false});
grid.addEventListener('touchmove', onMove, {passive:false});
grid.addEventListener('touchend', onEnd);
} else {
grid.addEventListener('pointerdown', onStart);
grid.addEventListener('pointermove', onMove);
grid.addEventListener('pointerup', onEnd);
}
}

// ---------- НЕДЕЛЯ ----------
function getWeek(dt){
const fd = parseInt(sett('firstDay','1'));
const diff = (dt.getDay() - fd + 7) % 7;
const mon = new Date(dt);
mon.setDate(dt.getDate() - diff);
return Array.from({length:7}, (_,i)=>{
const d = new Date(mon);
d.setDate(mon.getDate() + i);
return d;
});
}

function drawWeek(week){
const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const fd = parseInt(sett('firstDay','1'));
const od = Array.from({length:7}, (_,i)=> days[(fd+i)%7]);
const sh = parseInt(sett('dayStart','06:00'));
const eh = parseInt(sett('dayEnd','23:00'));

let html = '<div class="week-scroll"><div class="week-table">';
html += '<div class="week-header"><div class="whour"></div>';
od.forEach((d,i)=>{
const dt = week[i];
const isToday = sameDay(dt, new Date());
html += `<div class="wday" data-day="${i}" style="${isToday?'color:var(--accent);':''}">${d}<br>${dt.getDate()}</div>`;
});
html += '</div>';

for(let h=sh; h<=eh; h++){
html += `<div class="week-row"><div class="whour">${pad(h)}:00</div>`;
week.forEach((date, di)=>{
html += `<div class="wday" data-day="${di}">`;
dayTasks(date).forEach(t=>{
const s = new Date(t.start);
const e = new Date(t.end);
if(s.getHours() === h || (s.getHours() < h && e.getHours() > h)){
const sm = s.getHours()*60 + s.getMinutes();
const em = e.getHours()*60 + e.getMinutes();
const top = Math.max(0, (sm - h*60)/60*ROWH);
const hgt = Math.max(Math.min(ROWH - top, (em - Math.max(h*60, sm))/60*ROWH), 14);
const tc = isLight(t.color) ? '#2B2B30' : '#ECE4E5';
html += `<div class="week-task${t.fixed?' fixed':''}" data-id="${t.id}" data-day="${di}"
style="top:${top}px;height:${hgt}px;background:${t.color};color:${tc};"
onclick="event.stopPropagation();">
${t.emoji||''}${t.title}
<span class="task-dup" onclick="event.stopPropagation();duplicateTask('${t.id}')">⧉</span>
<span class="task-del" onclick="event.stopPropagation();delTask('${t.id}')">✕</span>
${t.fixed ? '' : '<div class="resize-handle"></div>'}
</div>`;
}
});
html += '</div>';
});
html += '</div>';
}
html += '</div></div>';
document.getElementById('grid').innerHTML = html;
setupWeekDrag(week);
}

function setupWeekDrag(week){
const table = document.querySelector('.week-table');
if(!table) return;
const isTouch = 'ontouchstart' in window;
let el = null, tid = null, resizing = false;
let startY = 0, startTop = 0, startHeight = 0, currentDay = 0;

function getDayColumns(){
const hd = table.querySelectorAll('.week-header .wday');
const cols = [];
hd.forEach(d=>{
const r = d.getBoundingClientRect();
cols.push({day: parseInt(d.dataset.day), left: r.left, right: r.right});
});
return cols;
}
function getDayFromX(cx){
const cols = getDayColumns();
for(const c of cols){ if(cx >= c.left && cx <= c.right) return c.day; }
if(cols.length > 0 && cx < cols[0].left) return cols[0].day;
if(cols.length > 0 && cx > cols[cols.length-1].right) return cols[cols.length-1].day;
return currentDay;
}

function onStart(e){
const point = isTouch ? e.touches[0] : e;
if(isTouch && e.target.closest('.task-del, .task-dup')) return;
const tb = (!isTouch ? e.target : document.elementFromPoint(point.clientX, point.clientY))?.closest('.week-task');
if(!tb || tb.classList.contains('fixed')) return;

const handleEl = (isTouch ? document.elementFromPoint(point.clientX, point.clientY) : e.target);
resizing = !!(handleEl?.closest('.resize-handle'));

el = tb;
tid = tb.dataset.id;
currentDay = parseInt(tb.dataset.day);
startY = point.clientY;
startTop = tb.offsetTop;
startHeight = tb.offsetHeight;

tb.classList.add('dragging');
if(!isTouch) tb.setPointerCapture(e.pointerId);
e.preventDefault();
}

function onMove(e){
if(!el) return;
const point = isTouch ? e.touches[0] : e;
const nd = getDayFromX(point.clientX);
if(nd !== currentDay){
currentDay = nd;
el.dataset.day = currentDay;
const row = el.closest('.week-row');
if(row){
const cell = row.querySelector(`.wday[data-day="${currentDay}"]`);
if(cell && el.parentElement !== cell){
cell.appendChild(el);
startY = point.clientY;
startTop = 0;
el.style.top = '0px';
}
}
}
const dy = point.clientY - startY;
if(resizing) el.style.height = Math.max(14, startHeight + dy) + 'px';
else el.style.top = Math.max(0, startTop + Math.round(dy/ROWH)*ROWH) + 'px';
if(isTouch) e.preventDefault();
}

function onEnd(){
if(!tid || !el) return;
const date = week[currentDay];
const h = parseInt(sett('dayStart','06:00'));
const topPx = parseInt(el.style.top || 0);
const hgtPx = parseInt(el.style.height || 14);

const startMin = h*60 + Math.round(topPx/ROWH)*60;
const endMin = startMin + Math.max(Math.round(hgtPx/ROWH)*60, 5);
const ds = localDateStr(date);
const ns = new Date(ds + 'T' + pad(Math.floor(startMin/60)) + ':' + pad(startMin%60) + ':00');
const ne = new Date(ds + 'T' + pad(Math.floor(endMin/60)) + ':' + pad(endMin%60) + ':00');

updateTask(tid, ns, ne);

el.classList.remove('dragging');
el = null; tid = null; currentDay = 0; resizing = false;
drawCal();
}

if(isTouch){
table.addEventListener('touchstart', onStart, {passive:false});
table.addEventListener('touchmove', onMove, {passive:false});
table.addEventListener('touchend', onEnd);
} else {
table.addEventListener('pointerdown', onStart);
table.addEventListener('pointermove', onMove);
table.addEventListener('pointerup', onEnd);
}
}

// ---------- МЕСЯЦ ----------
function drawMonth(){
const y = curDate.getFullYear();
const m = curDate.getMonth();
const fd = parseInt(sett('firstDay','1'));
const first = new Date(y, m, 1);
const last = new Date(y, m+1, 0);
const pad0 = (first.getDay() - fd + 7) % 7;
const od = Array.from({length:7}, (_,i)=> ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][(fd+i)%7]);

let html = '<div class="month-grid">';
od.forEach(d=> html += `<div class="month-day-name">${d}</div>`);
for(let i=0; i<pad0; i++) html += '<div class="month-day"></div>';

for(let d=1; d<=last.getDate(); d++){
const dt = new Date(y, m, d);
const ds = localDateStr(dt);
const isToday = sameDay(dt, new Date());
html += `<div class="month-day" onclick="curDate=new Date('${ds}T12:00:00');setView('day');">
<div class="month-day-num" style="${isToday?'color:var(--accent);font-weight:800;':''}">${d}</div>`;
const list = dayTasks(dt);
list.slice(0,3).forEach(t=>{
const tc = isLight(t.color) ? '#2B2B30' : '#ECE4E5';
html += `<div class="month-task" style="background:${t.color};color:${tc};">${t.emoji||''}${t.title}</div>`;
});
if(list.length > 3) html += `<div style="font-size:9px;color:var(--sub);">+${list.length-3}</div>`;
html += '</div>';
}
html += '</div>';
document.getElementById('grid').innerHTML = html;
}

// ================= МОДАЛКИ =================
function closeMod(id){ document.getElementById(id)?.classList.remove('show'); }
document.addEventListener('click', e=>{
if(e.target.classList.contains('modal-bg')) e.target.classList.remove('show');
});

// ================= ИНИЦИАЛИЗАЦИЯ =================
function fillTimeSelects(){
const th = document.getElementById('th');
const tm = document.getElementById('tm');
th.innerHTML = Array.from({length:24}, (_,h)=> `<option value="${h}">${pad(h)}</option>`).join('');
tm.innerHTML = Array.from({length:12}, (_,i)=> {
const m = i*5;
return `<option value="${m}">${pad(m)}</option>`;
}).join('');
th.value = '0';
tm.value = '0';
}

function init(){
loadLocal();
document.getElementById('app').style.display = 'flex';
fillTimeSelects();
renderCatSelect();
setView('day');

setInterval(()=>{
if(viewMode==='day' && sameDay(curDate, new Date())) drawCal();
}, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
